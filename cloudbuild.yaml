# ==============================================================================
# Cloud Build Pipeline with CodeMender Security Gate
# Docs: https://docs.cloud.google.com/gemini-enterprise-agent-platform/codemender
# ==============================================================================

steps:
  # ----------------------------------------------------------------------------
  # Step 1: CodeMender Vulnerability Scan & Policy Gate
  # ----------------------------------------------------------------------------
  - name: 'google/cloud-sdk:slim'
    id: 'codemender-security-scan'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -eo pipefail
        export DEBIAN_FRONTEND=noninteractive
        echo "================================================================"
        echo ">> Initializing CodeMender Security Scanner..."
        echo "================================================================"

        # Install prerequisites (curl, unzip, python3, jq)
        apt-get update -qq && apt-get install -y -qq curl unzip jq python3 > /dev/null

        # Download & install CodeMender CLI
        echo ">> Downloading CodeMender CLI (Linux x86_64)..."
        CLI_DOWNLOAD_URL="https://artifactregistry.googleapis.com/download/v1/projects/cmoc-prod/locations/us/repositories/codemender-cli-production/files/cm%3Astable%3Acm-linux-amd64.zip:download?alt=media"
        FALLBACK_URL="https://storage.googleapis.com/codemender-public/cmoc/cmoc-linux-amd64.zip"

        if ! curl -sSL -f -o cm-linux-amd64.zip "$${CLI_DOWNLOAD_URL}"; then
          echo ">> Primary download endpoint unavailable; attempting fallback URL..."
          curl -sSL -f -o cm-linux-amd64.zip "$${FALLBACK_URL}"
        fi

        mkdir -p /tmp/cm_install
        unzip -q -o cm-linux-amd64.zip -d /tmp/cm_install
        BIN_FILE=$(find /tmp/cm_install -type f -name "cm*" | head -n 1)
        chmod +x "$${BIN_FILE}"
        mv "$${BIN_FILE}" /usr/local/bin/cm
        rm -rf /tmp/cm_install cm-linux-amd64.zip
        echo ">> CodeMender CLI installed successfully: $(cm --version 2>/dev/null || echo 'cm binary ready')"

        # Initialize workspace
        echo ">> Initializing CodeMender workspace..."
        cm init

        # Run CodeMender find on repository
        echo ">> Executing CodeMender security scan across repository..."
        cm find . -y --compact || cm find . -y

        # Generate structured JSON and human-readable reports
        echo ">> Generating vulnerability reports..."
        cm report | tee /workspace/codemender-report.txt
        cm report --format json > /workspace/codemender-report.json 2>&1 || true

        # Policy Gate: Fail pipeline if HIGH or CRITICAL vulnerabilities are found
        echo ">> Evaluating Security Quality Gate for HIGH and CRITICAL vulnerabilities..."
        python3 - <<'EOF'
        import json, sys, re

        blocking_findings = []

        # 1. Attempt JSON parsing with log stripping
        try:
            with open('/workspace/codemender-report.json', 'r', errors='ignore') as f:
                raw_content = f.read()

            # Find the JSON array or object inside the output (stripping any [INFO] logs)
            match = re.search(r'(\[.*\]|\{.*\})', raw_content, re.DOTALL)
            if match:
                data = json.loads(match.group(1))
                findings = data if isinstance(data, list) else data.get("findings", data.get("vulnerabilities", []))
                for item in findings:
                    sev = str(item.get("severity", "")).upper()
                    status = str(item.get("status", "OPEN")).upper()
                    if ("HIGH" in sev or "CRITICAL" in sev) and status not in ["FIXED", "DISMISSED"]:
                        title = item.get('title', item.get('vulnerability_type', 'Vulnerability'))
                        path = item.get('file_path', item.get('target_file', 'unknown'))
                        line = item.get('line', 'N/A')
                        blocking_findings.append(f"[{sev}] {title} ({path}:{line})")
        except Exception as e:
            print(f"Note: JSON parser encountered: {e}. Falling back to tabular report...")

        # 2. Fallback / Verification: Parse table output directly
        try:
            with open('/workspace/codemender-report.txt', 'r', errors='ignore') as f:
                for line in f:
                    # Match table rows containing CRITICAL or HIGH severity with OPEN status
                    if ("CRITICAL" in line or "HIGH" in line) and "OPEN" in line:
                        clean_line = " ".join(line.strip().replace("│", " ").split())
                        if clean_line and clean_line not in blocking_findings:
                            blocking_findings.append(clean_line)
        except Exception as e:
            print(f"Note: Text parser encountered: {e}")

        # 3. Enforce Security Quality Gate
        if blocking_findings:
            print("\n" + "="*70)
            print(f"❌ [POLICY VIOLATION] Found {len(blocking_findings)} HIGH / CRITICAL vulnerabilities in repository:")
            print("="*70)
            for vuln in blocking_findings:
                print(f"  • {vuln}")
            print("="*70)
            print(">> Build failed by CodeMender Security Gate. Remediation required before deployment.\n")
            sys.exit(1)
        else:
            print("\n✅ [POLICY PASSED] No unmitigated HIGH or CRITICAL vulnerabilities found.")
        EOF

  # ----------------------------------------------------------------------------
  # Step 2: Build Application Container Image
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker-build'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE_REPO}/${_IMAGE_NAME}:${SHORT_SHA}'
      - '-t'
      - '${_IMAGE_REPO}/${_IMAGE_NAME}:latest'
      - '.'

  # ----------------------------------------------------------------------------
  # Step 3: Push Image to Artifact Registry
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker-push'
    args:
      - 'push'
      - '--all-tags'
      - '${_IMAGE_REPO}/${_IMAGE_NAME}'

  # ----------------------------------------------------------------------------
  # Step 4: Deploy Container to Cloud Run
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'cloud-run-deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_IMAGE_REPO}/${_IMAGE_NAME}:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - '${_RUN_SA_EMAIL}'
      - '--port'
      - '3000'
      - '--memory'
      - '1Gi'

substitutions:
  _IMAGE_REPO: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/app-containers'
  _IMAGE_NAME: 'juice-shop'
  _SERVICE_NAME: 'juice-shop'
  _REGION: 'us-central1'
  _RUN_SA_EMAIL: 'juice-shop-runner@${PROJECT_ID}.iam.gserviceaccount.com'

options:
  logging: CLOUD_LOGGING_ONLY
